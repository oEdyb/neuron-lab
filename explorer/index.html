<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Neuron Lab · Tower / Plane</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script></head>
<body>
<main id="viewport" aria-label="3D neuron tower" tabindex="0"></main>
<header><a class="brand" href="./">neuron<span>lab</span></a><span class="model">Qwen3.5–2B</span><nav><button id="tower" aria-pressed="true">Tower</button><button id="plane-open">Plane ↗</button></nav><button id="palette-open">⌕ <span>Search & favourites</span> <kbd>⌘ K</kbd></button><button id="chat-open" hidden>Chat ↗</button></header>
<section id="tower-meta"><h1>24 layers</h1><span>147,456 neurons</span></section>
<aside id="rail" aria-label="Layers"></aside>
<section id="plane" hidden><div class="plane-head"><h1 id="layer-title">Layer 00</h1><span id="plane-count"></span><div class="stepper"><button id="prev" aria-label="Previous layer">←</button><span id="step">00 / 23</span><button id="next" aria-label="Next layer">→</button></div></div><canvas id="grid" tabindex="0" aria-label="Neuron plane, arrow keys move selection"></canvas><div class="plane-foot"><span id="hover-id">L0</span><span>KL / random p95 <i class="gradient"></i> 0 · 1× · 12×+</span></div></section>
<aside id="facts" hidden></aside><aside id="selection" hidden></aside>
<aside id="chat" hidden><div class="panel-head"><span>Compare</span><button id="chat-expand" aria-label="Expand chat">Expand ↗</button><button id="chat-close" aria-label="Close chat">×</button></div><div id="pushes">Select a neuron to compare doses</div><div id="chat-controls"></div><div id="chat-log" aria-live="polite"></div><form id="composer"><input id="message" aria-label="Chat message" placeholder="Ask the model…" required><button id="send" aria-label="Send message">↑</button></form></aside>
<footer id="tower-footer"><span>00 — 23</span><button id="enter">Enter layer <kbd>↵</kbd></button><span>Drag to orbit</span></footer>
<aside id="palette" aria-label="Search and favourites"><form id="search"><span>⌕</span><input id="query" aria-label="Search words or neuron coordinates" placeholder="Word, meaning, or L17 N5244" autocomplete="off" spellcheck="false"></form><div class="palette-tabs"><button data-tab="semantic" aria-pressed="true">Semantic</button><button data-tab="exact">Exact word</button><button data-tab="favourites">Favourites <span id="fav-count">0</span></button></div><div id="results" role="listbox" aria-label="Results"></div><div class="palette-foot"><span id="search-status">All 24 layers</span></div></aside>
<div id="tooltip" hidden></div><div id="error" role="alert" hidden></div><script type="module" src="app.js"></script></body></html>
