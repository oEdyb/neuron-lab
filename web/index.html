<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neuron-lab</title>
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/map.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body data-view="both">
  <header id="view-header"><a href="/" class="brand">neuron-lab <span>/ Qwen3.5-2B</span></a><nav aria-label="View"><button data-view="map">Map</button><button data-view="both" aria-pressed="true">Map + chat</button><button data-view="chat">Chat</button></nav></header>
  <section id="map-view" aria-label="Neuron layer map">
    <div id="map-tools"><form id="map-search"><input aria-label="Search neurons or words" placeholder="Search words or L17 N5244" autocomplete="off"><div id="map-results" hidden></div></form><button id="fit" title="Fit all (F)">Fit all <kbd>F</kbd></button><button id="shortcuts" aria-label="Keyboard shortcuts">?</button></div>
    <div id="viewport" tabindex="0" aria-label="3D neuron map"></div><div id="layer-labels"></div>
    <div id="map-bottom"><span id="map-count">Loading map…</span><span>Brightness <i class="brightness"></i> KL / random p95</span></div>
    <div id="tooltip" hidden></div>
    <section id="neuron-panel" hidden aria-label="Selected neuron"></section>
    <dialog id="keys"><h2>Navigation</h2><p>Drag · orbit<br>Right drag / Shift drag · pan<br>Scroll · zoom to cursor<br>F · fit all<br>1 · selected layer face-on<br>[ / ] · previous / next layer<br>/ · search<br>Esc · clear selection</p><button id="close-keys">Close</button></dialog>
    <p id="map-error" hidden role="alert"></p>
  </section>
  <aside id="side">
    <div class="top">
      <span class="name">neuron-lab</span>
      <select id="model" aria-label="Model"></select>
    </div>

    <section>
      <h2>Neurons</h2>
      <ul id="pushes"></ul>
      <form id="add" class="add">
        <input id="add-input" class="mono" placeholder="L17 N5244" aria-label="Add a neuron" autocomplete="off">
      </form>
    </section>

    <section>
      <h2>Find</h2>
      <div id="pairs"></div>
      <button type="button" id="add-pair" class="link">+ pair</button>
      <div class="row">
        <input id="layers" class="mono" value="3-23" aria-label="Layers to search" title="Layers to search">
        <div class="seg" id="where" role="radiogroup" aria-label="Run on">
          <button type="button" data-v="local" role="radio">Local</button>
          <button type="button" data-v="modal" role="radio">Modal</button>
        </div>
        <button type="button" id="find" class="primary">Find</button>
      </div>
      <p id="find-error" class="error" hidden></p>
      <ol id="results"></ol>
    </section>

    <div class="foot">
      <button type="button" id="copy" class="link">Copy for agent</button>
      <button type="button" id="clear" class="link">Clear chat</button>
    </div>
  </aside>

  <main>
    <div id="heads" class="cols"></div>
    <div id="log"></div>
    <p id="status" class="sr" aria-live="polite"></p>
    <form id="composer">
      <textarea id="msg" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <div class="bar">
        <label><input type="checkbox" id="compare" checked> Compare</label>
        <label><input type="checkbox" id="sample"> Sample</label>
        <button id="send" class="primary" aria-label="Send">↑</button>
      </div>
    </form>
  </main>
  <script src="/web/app.js"></script>
  <script type="module" src="/web/map.js"></script>
</body>
</html>
